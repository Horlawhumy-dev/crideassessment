services:
  postgres:
    image: postgres:16-alpine
    container_name: cride-postgres
    environment:
      POSTGRES_USER: cride
      POSTGRES_PASSWORD: cride
      POSTGRES_DB: cride
    # Host ports are overridable so the stack can coexist with a Postgres/Redis
    # already running on the default ports. The DATABASE_URL in .env must use the
    # same host port, which is what POSTGRES_HOST_PORT exists to keep in step.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - cride-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cride -d cride"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cride-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cride-pgdata:
